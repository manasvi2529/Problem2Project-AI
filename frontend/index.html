<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ProblemPilot AI (Problem2Project AI) — Autonomous, live-research real-world problem discovery and project-building intelligence platform.">
    <title>ProblemPilot AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar Navigation -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <circle cx="14" cy="14" r="12" stroke="url(#grad1)" stroke-width="2.5"/>
                        <path d="M9 14L13 18L19 10" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs><linearGradient id="grad1" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
                    </svg>
                </div>
                <span class="brand-name">Problem<span class="brand-accent">Pilot</span></span>
            </div>

            <div class="sidebar-menu">
                <a href="#/" class="nav-item active" data-page="home" id="nav-home">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span>One-Prompt Studio</span>
                </a>
                <a href="#/research" class="nav-item" data-page="research" id="nav-research">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <span>Live Research</span>
                </a>
                <a href="#/opportunities" class="nav-item" data-page="opportunities" id="nav-opportunities">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    <span>Opportunities</span>
                </a>
                <a href="#/projects" class="nav-item" data-page="projects" id="nav-projects">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    <span>Project Workspace</span>
                </a>
                <a href="#/teacher" class="nav-item" data-page="teacher" id="nav-teacher">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    <span>AI Teacher</span>
                </a>
                <a href="#/approvals" class="nav-item" data-page="approvals" id="nav-approvals">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                    <span>Approvals</span>
                    <span id="approval-badge" class="nav-badge hidden">0</span>
                </a>
                <a href="#/integrations" class="nav-item" data-page="integrations" id="nav-integrations">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span>Cloud & GitHub</span>
                </a>
            </div>

            <div class="sidebar-footer">
                <div class="theme-toggle-row">
                    <span class="mode-label">Appearance</span>
                    <button id="theme-toggle-btn" class="theme-btn" title="Toggle Light / Dark Theme">
                        <span id="theme-btn-icon">☀️</span> <span id="theme-btn-text">Light Mode</span>
                    </button>
                </div>
                <div class="theme-toggle-row" style="margin-top: 8px;">
                    <span class="mode-label">Voice (TTS)</span>
                    <button id="voice-toggle-btn" class="theme-btn" title="Toggle Voice Narration / Text-to-Speech">
                        <span id="voice-btn-icon">🔊</span> <span id="voice-btn-text">Voice On</span>
                    </button>
                </div>
                <div id="mode-switcher" class="mode-switcher">
                    <div class="mode-label">Operating Mode</div>
                    <div class="mode-buttons">
                        <button class="mode-btn" data-mode="autonomous" title="AI works independently, pauses for approvals">Auto</button>
                        <button class="mode-btn active" data-mode="hybrid" title="Collaborative: AI + You">Hybrid</button>
                        <button class="mode-btn" data-mode="guided" title="You lead, AI teaches and assists">Guided</button>
                    </div>
                </div>
                <div id="user-info" class="user-info hidden">
                    <div class="user-avatar" id="user-avatar">U</div>
                    <div class="user-details">
                        <span id="user-name" class="user-name">User</span>
                        <span id="user-mode" class="user-mode">Hybrid Mode</span>
                    </div>
                    <button id="logout-btn" class="icon-btn" title="Logout">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <div id="page-container" class="page-container">
                <!-- Pages rendered here by router -->
            </div>
        </main>

        <!-- Toast Notifications -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Auth Modal -->
        <div id="auth-modal" class="modal-overlay">
            <div class="modal glass-card auth-modal">
                <div class="auth-header">
                    <div class="brand-icon large">
                        <svg width="48" height="48" viewBox="0 0 28 28" fill="none">
                            <circle cx="14" cy="14" r="12" stroke="url(#grad2)" stroke-width="2"/>
                            <path d="M9 14L13 18L19 10" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <defs><linearGradient id="grad2" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
                        </svg>
                    </div>
                    <h1>Problem2Project <span class="text-gradient">AI</span></h1>
                    <p class="auth-subtitle">Discover problems. Build solutions.</p>
                </div>

                <div id="auth-tabs" class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">Sign In</button>
                    <button class="auth-tab" data-tab="register">Create Account</button>
                </div>

                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full" id="login-submit">
                        <span>Sign In</span>
                        <div class="btn-loader hidden"></div>
                    </button>
                </form>

                <form id="register-form" class="auth-form hidden">
                    <div class="form-group">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" placeholder="Jane Doe">
                    </div>
                    <div class="form-group">
                        <label for="reg-username">Username</label>
                        <input type="text" id="reg-username" placeholder="janedoe" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" placeholder="Min 8 characters" required minlength="8">
                    </div>
                    <button type="submit" class="btn btn-primary btn-full" id="register-submit">
                        <span>Create Account</span>
                        <div class="btn-loader hidden"></div>
                    </button>
                </form>

                <div id="auth-error" class="auth-error hidden"></div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
